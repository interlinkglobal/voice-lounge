<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050706">
  <title>Offline | The Voice Lounge</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,#073529 0,transparent 36%),radial-gradient(circle at 90% 0%,#3a3016 0,transparent 30%),#050706;color:#f7f4eb;font:500 16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{max-width:560px;padding:32px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(15,20,17,.78);backdrop-filter:blur(24px);box-shadow:0 24px 80px rgba(0,0,0,.45)}img{width:112px;height:112px;border-radius:24px;display:block;margin-bottom:24px}h1{font-size:clamp(2rem,7vw,3.7rem);line-height:.95;margin:0;letter-spacing:-.05em}p{color:#b9c0bb;margin:18px 0 0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}a,button{border:0;border-radius:999px;padding:12px 18px;font:700 14px system-ui;text-decoration:none;cursor:pointer}.primary{background:#00b96b;color:#fff}.secondary{background:#161d19;color:#fff;border:1px solid rgba(255,255,255,.12)}
  </style>
</head>
<body>
  <main class="card">
    <img src="/icon-192x192.png" alt="The Voice Lounge">
    <h1>The studio is offline.</h1>
    <p>Your installed Voice Lounge app is still available. Reconnect to refresh live programming, YouTube video feeds and the latest catalogue.</p>
    <div class="actions">
      <button class="primary" onclick="location.reload()">Try again</button>
      <a class="secondary" href="/">Open cached home</a>
    </div>
  </main>
</body>
</html>
